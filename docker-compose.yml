# VoxGuard — Multi-service orchestration
# Uses Aiven cloud for PostgreSQL and Valkey (Redis)
# Only application services are containerized

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://15.206.210.253:8000
      - NEXT_PUBLIC_WS_URL=ws://15.206.210.253:8000
    depends_on:
      - backend
    networks:
      - voxguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ml-service
    networks:
      - voxguard-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ml-models:/app/models
      - ml-tmp:/app/tmp
    networks:
      - voxguard-network

networks:
  voxguard-network:
    driver: bridge

volumes:
  ml-models:
  ml-tmp: